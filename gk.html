<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hardik's Quiz — 🌍 GENERAL KNOWLEDGE</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#eef6ff;background:radial-gradient(circle at 20% 10%,#10234b 0,#050812 42%,#02040a 100%);min-height:100vh}body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(0,234,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,234,255,.035) 1px,transparent 1px);background-size:35px 35px;pointer-events:none}.wrap{width:min(850px,92%);margin:0 auto;padding:25px 0 50px}nav{display:flex;justify-content:space-between;align-items:center;padding:16px 4%;border-bottom:1px solid #1a3555;background:#030710dd;position:sticky;top:0;z-index:5;backdrop-filter:blur(10px)}.logo{color:#00eaff;text-decoration:none;font-weight:900;letter-spacing:2px;text-shadow:0 0 14px #00eaff66}.back{color:#aabbd0;text-decoration:none}.quiz{margin-top:30px;padding:28px;border:1px solid #21446b;border-radius:22px;background:#07101eea;box-shadow:0 0 45px #00eaff0d}.title{font-size:clamp(28px,6vw,50px);margin:0 0 8px;text-shadow:0 0 20px #00eaff55}.sub{color:#91a1b7;margin-bottom:25px}.quiz-head{display:flex;justify-content:space-between;gap:15px;color:#91a1b7;font-weight:700}.quiz-head strong{color:#00eaff}.progress{height:8px;background:#172238;border-radius:20px;overflow:hidden;margin:12px 0 28px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#00eaff,#ff2bd6);transition:.3s}.q{font-size:clamp(21px,4vw,32px);font-weight:800;line-height:1.25;margin:25px 0}.answers{display:grid;gap:12px}.answer{width:100%;padding:17px;border:1px solid #294567;border-radius:13px;background:#0c1728;color:#eef6ff;font-size:17px;text-align:left;cursor:pointer;transition:.18s}.answer:hover:not(:disabled){border-color:#00eaff;box-shadow:0 0 18px #00eaff18;transform:translateY(-1px)}.answer.correct{border-color:#5cff9d;background:#0b3022;color:#5cff9d}.answer.wrong{border-color:#ff627c;background:#32121c;color:#ff8297}.answer:disabled{cursor:default}.fb{min-height:25px;font-weight:800;margin:18px 0}.actions{display:flex;gap:12px;flex-wrap:wrap}.btn{display:inline-block;padding:13px 18px;border-radius:12px;border:1px solid #2b4667;background:#0a1526;color:#dcecff;text-decoration:none;cursor:pointer;font-weight:800}.primary{border-color:#00eaff;background:#00eaff;color:#03101a;box-shadow:0 0 22px #00eaff33}.result{text-align:center;padding:25px 0}.score{font-size:72px;font-weight:900;color:#00eaff;text-shadow:0 0 25px #00eaff66}.hidden{display:none}footer{text-align:center;color:#62738b;padding:25px;border-top:1px solid #16253a}
@media(max-width:600px){.quiz{padding:20px}.quiz-head{font-size:14px}nav{gap:10px}}
</style></head><body>
<nav><a class="logo" href="index.html">HARDIK'S QUIZ ⚡</a><a class="back" href="index.html">← ALL QUIZZES</a></nav>
<main class="wrap"><section class="quiz" id="quiz"><h1 class="title">🌍 GENERAL KNOWLEDGE</h1><p class="sub">Quick-fire GK on India and the world.</p><div class="quiz-head"><span id="count">QUESTION 1 / 10</span><strong id="score">SCORE: 0</strong></div><div class="progress"><i id="fill"></i></div><div class="q" id="question"></div><div class="answers" id="answers"></div><div class="fb" id="fb"></div><div class="actions"><a class="btn" href="index.html">← QUIZ HUB</a></div></section><section class="quiz result hidden" id="result"><h1 class="title">QUIZ COMPLETE</h1><p>Your final score</p><div class="score" id="finalScore">0 / 10</div><p id="message"></p><div class="actions" style="justify-content:center"><button class="btn primary" id="restart">PLAY AGAIN ↻</button><a class="btn" href="index.html">ALL QUIZZES</a></div></section></main><footer>HARDIK'S QUIZ • FUTURE GAMING CHALLENGE</footer>
<script>const questions=[["What is the capital of India?",["Mumbai","New Delhi","Kolkata","Chennai"],"New Delhi"],["Which is the largest ocean on Earth?",["Atlantic Ocean","Indian Ocean","Pacific Ocean","Arctic Ocean"],"Pacific Ocean"],["How many continents are there on Earth?",["5","6","7","8"],"7"],["Which country is known as the Land of the Rising Sun?",["China","Japan","Thailand","South Korea"],"Japan"],["Who wrote the Indian national anthem?",["Bankim Chandra Chattopadhyay","Rabindranath Tagore","Sarojini Naidu","Subhas Chandra Bose"],"Rabindranath Tagore"],["Which is the smallest planet in our solar system?",["Mars","Mercury","Venus","Earth"],"Mercury"],["Which is the longest river in India?",["Yamuna","Godavari","Ganga","Narmada"],"Ganga"],["How many players are on the field for one cricket team at a time?",["9","10","11","12"],"11"],["Which currency is used in Japan?",["Won","Yuan","Yen","Dollar"],"Yen"],["Which instrument is used to measure temperature?",["Barometer","Thermometer","Hygrometer","Anemometer"],"Thermometer"]];let current=0,score=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}function render(){locked=false;const item=questions[current];document.getElementById('count').textContent=`QUESTION ${current+1} / ${questions.length}`;document.getElementById('score').textContent=`SCORE: ${score}`;document.getElementById('fill').style.width=`${(current/questions.length)*100}%`;document.getElementById('question').textContent=item[0];const box=document.getElementById('answers');box.innerHTML='';document.getElementById('fb').textContent='';shuffle(item[1]).forEach(option=>{const b=document.createElement('button');b.className='answer';b.type='button';b.textContent=option;b.onclick=()=>choose(b,option,item[2]);box.appendChild(b)})}function choose(btn,selected,correct){if(locked)return;locked=true;document.querySelectorAll('.answer').forEach(b=>b.disabled=true);const fb=document.getElementById('fb');if(selected===correct){score++;btn.classList.add('correct');fb.textContent='✓ CORRECT';fb.style.color='#5cff9d'}else{btn.classList.add('wrong');document.querySelectorAll('.answer').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});fb.textContent='✕ WRONG — correct answer highlighted';fb.style.color='#ff8297'}document.getElementById('score').textContent=`SCORE: ${score}`;setTimeout(()=>{current++;current<questions.length?render():finish()},700)}function finish(){document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('finalScore').textContent=`${score} / ${questions.length}`;document.getElementById('message').textContent=score===questions.length?'🔥 PERFECT SCORE!':score>=7?'⚡ Great job! Try again and beat your score.':'🎮 Good try! Run it again and level up.'}document.getElementById('restart').onclick=()=>{current=0;score=0;document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render()};render();</script></body></html>
