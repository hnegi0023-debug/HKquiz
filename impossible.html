<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hardik's Quiz — 🧠 IMPOSSIBLE QUIZ</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#eef6ff;background:radial-gradient(circle at 20% 10%,#26104b 0,#050812 42%,#02040a 100%);min-height:100vh}body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(0,234,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,234,255,.035) 1px,transparent 1px);background-size:35px 35px;pointer-events:none}.wrap{width:min(850px,92%);margin:0 auto;padding:25px 0 50px}nav{display:flex;justify-content:space-between;align-items:center;padding:16px 4%;border-bottom:1px solid #1a3555;background:#030710dd;position:sticky;top:0;z-index:5;backdrop-filter:blur(10px)}.logo{color:#ff2bd6;text-decoration:none;font-weight:900;letter-spacing:2px;text-shadow:0 0 14px #ff2bd666}.back{color:#aabbd0;text-decoration:none}.quiz{margin-top:30px;padding:28px;border:1px solid #5b2a68;border-radius:22px;background:#10091bea;box-shadow:0 0 45px #ff2bd60d}.title{font-size:clamp(28px,6vw,50px);margin:0 0 8px;text-shadow:0 0 20px #ff2bd655}.sub{color:#91a1b7;margin-bottom:25px}.quiz-head{display:flex;justify-content:space-between;gap:15px;color:#91a1b7;font-weight:700}.quiz-head strong{color:#ff2bd6}.progress{height:8px;background:#172238;border-radius:20px;overflow:hidden;margin:12px 0 28px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#ff2bd6,#ff2bd6);transition:.3s}.q{font-size:clamp(21px,4vw,32px);font-weight:800;line-height:1.25;margin:25px 0}.answers{display:grid;gap:12px}.answer{width:100%;padding:17px;border:1px solid #513b62;border-radius:13px;background:#181023;color:#eef6ff;font-size:17px;text-align:left;cursor:pointer;transition:.18s}.answer:hover:not(:disabled){border-color:#ff2bd6;box-shadow:0 0 18px #ff2bd618;transform:translateY(-1px)}.answer.correct{border-color:#5cff9d;background:#0b3022;color:#5cff9d}.answer.wrong{border-color:#ff627c;background:#32121c;color:#ff8297}.answer:disabled{cursor:default}.fb{min-height:25px;font-weight:800;margin:18px 0}.actions{display:flex;gap:12px;flex-wrap:wrap}.btn{display:inline-block;padding:13px 18px;border-radius:12px;border:1px solid #2b4667;background:#0a1526;color:#dcecff;text-decoration:none;cursor:pointer;font-weight:800}.primary{border-color:#ff2bd6;background:#ff2bd6;color:#03101a;box-shadow:0 0 22px #ff2bd633}.result{text-align:center;padding:25px 0}.score{font-size:72px;font-weight:900;color:#ff2bd6;text-shadow:0 0 25px #ff2bd666}.hidden{display:none}footer{text-align:center;color:#62738b;padding:25px;border-top:1px solid #16253a}
@media(max-width:600px){.quiz{padding:20px}.quiz-head{font-size:14px}nav{gap:10px}}
</style></head><body><nav><a class="logo" href="index.html">HARDIK'S QUIZ ⚡</a><a class="back" href="index.html">← ALL QUIZZES</a></nav>
<main class="wrap"><section class="quiz" id="quiz"><h1 class="title">🧠 IMPOSSIBLE QUIZ</h1><p class="sub">Questions designed to make you question what can actually be known.</p><div class="quiz-head"><span id="count">QUESTION 1 / 10</span><strong id="score">SCORE: 0</strong></div><div class="progress"><i id="fill"></i></div><div class="q" id="question"></div><div class="answers" id="answers"></div><div class="fb" id="fb"></div><div class="actions"><a class="btn" href="index.html">← QUIZ HUB</a></div></section><section class="quiz result hidden" id="result"><h1 class="title">QUIZ COMPLETE</h1><p>Your final score</p><div class="score" id="finalScore">0 / 10</div><p id="message"></p><div class="actions" style="justify-content:center"><button class="btn primary" id="restart">PLAY AGAIN ↻</button><a class="btn" href="index.html">ALL QUIZZES</a></div></section></main><footer>HARDIK'S QUIZ • FUTURE GAMING CHALLENGE</footer><script>const questions=[["What is the meaning of life?",["42","To be happy","To survive","There is no universally proven answer"],"There is no universally proven answer"],["How many cells are in a living human body, in exact?",["30 trillion","37 trillion","100 trillion","There is no single exact fixed number"],"There is no single exact fixed number"],["Exactly how many hairs are on a person's entire body?",["100,000","5 million","1 million","There is no single exact number"],"There is no single exact number"],["What will the weather be at one exact location 100 years from today, at one exact minute?",["Sunny","Rainy","Cloudy","It cannot be known exactly today"],"It cannot be known exactly today"],["What is the exact number of atoms in your body right now?",["7 × 10²⁷","1 × 10²⁸","9 × 10²⁷","It cannot be given as one exact fixed number"],"It cannot be given as one exact fixed number"],["What is the exact number of thoughts a person will have tomorrow?",["6,200","12,000","50,000","It cannot be known exactly in advance"],"It cannot be known exactly in advance"],["What is the exact number of grains of sand on every beach on Earth?",["7.5 × 10¹⁸","1 × 10²⁰","10²²","No exact global count is known"],"No exact global count is known"],["What was the very first thought ever had by any living creature?",["Fear","Hunger","Survival","There is no recorded way to know"],"There is no recorded way to know"],["What is the exact number of possible chess games?",["10⁴³","10⁴⁰","10⁵⁰","It depends on how the game space is defined"],"It depends on how the game space is defined"],["What will your exact score be on a quiz you have not taken yet?",["0","5","10","It cannot be known before you take it"],"It cannot be known before you take it"]];let current=0,score=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}function render(){locked=false;const item=questions[current];document.getElementById('count').textContent=`QUESTION ${current+1} / ${questions.length}`;document.getElementById('score').textContent=`SCORE: ${score}`;document.getElementById('fill').style.width=`${(current/questions.length)*100}%`;document.getElementById('question').textContent=item[0];const box=document.getElementById('answers');box.innerHTML='';document.getElementById('fb').textContent='';shuffle(item[1]).forEach(option=>{const b=document.createElement('button');b.className='answer';b.type='button';b.textContent=option;b.onclick=()=>choose(b,option,item[2]);box.appendChild(b)})}function choose(btn,selected,correct){if(locked)return;locked=true;document.querySelectorAll('.answer').forEach(b=>b.disabled=true);const fb=document.getElementById('fb');if(selected===correct){score++;btn.classList.add('correct');fb.textContent='✓ CORRECT';fb.style.color='#5cff9d'}else{btn.classList.add('wrong');document.querySelectorAll('.answer').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});fb.textContent='✕ WRONG — correct answer highlighted';fb.style.color='#ff8297'}document.getElementById('score').textContent=`SCORE: ${score}`;setTimeout(()=>{current++;current<questions.length?render():finish()},700)}function finish(){document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('finalScore').textContent=`${score} / ${questions.length}`;document.getElementById('message').textContent=score===questions.length?'🧠 IMPOSSIBLE MASTER!':score>=7?'⚡ Your brain survived the impossible quiz.':'🎮 The impossible quiz got you. Try again!'}document.getElementById('restart').onclick=()=>{current=0;score=0;document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render()};render();</script></body></html>
